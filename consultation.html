<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultation parents / élèves</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="container" style="max-width:1000px;">
        <div class="header">
            <div style="display:flex;align-items:center;gap:0.85rem;">
                <div style="width:38px;height:38px;border-radius:0.6rem;background:rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;font-size:1.2rem;color:#fff;"><i class="bi bi-search"></i></div>
                <div>
                    <h1 style="font-size:1.4rem;font-weight:700;color:#fff;margin:0;">Consultation parents / élèves</h1>
                    <p style="color:rgba(255,255,255,0.9);font-size:0.8rem;margin:0;"><span id="cEcole">Établissement</span> — Notes, bulletins, assiduité et frais</p>
                </div>
            </div>
            <div style="display:flex;align-items:center;gap:0.75rem;">
                <div class="date-selector"><span>📅</span><input type="date" id="headerDate" onchange="if(window.onHeaderDate)onHeaderDate(this.value)"></div>
                <a href="portail.html" class="btn btn-light" style="text-decoration:none;"><i class="bi bi-arrow-left"></i> Portail</a>
            </div>
        </div>

        <div style="padding:1.5rem 0;">
            <div class="card">
                <h3 style="font-size:1.15rem;font-weight:700;margin-bottom:0.75rem;">Rechercher un élève</h3>
                <p style="color:#64748b;font-size:0.9rem;margin-bottom:1rem;">Entrez le <strong>matricule</strong> de l'élève (ex. MAT-2026-0001) ou son <strong>nom</strong>.</p>
                <div style="display:flex;gap:0.5rem;flex-wrap:wrap;">
                    <input type="text" id="cSearch" placeholder="Matricule ou nom de l'élève" style="flex:1;min-width:220px;margin:0;">
                    <button class="btn btn-primary" onclick="rechercher()"><i class="bi bi-search"></i> Rechercher</button>
                </div>
            </div>
            <div id="cResult"></div>
        </div>
    </div>

    <script src="js/consultation.js"></script>
    <script src="js/headerdate.js"></script>
</body>
</html>
