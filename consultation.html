<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recherche élève & famille</title>
    <link href="vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <script src="js/etablissement.js"></script>
    <link href="css/theme.css" rel="stylesheet">
    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
</head>
<body>
    <div class="container" style="max-width:1000px;">
        <div class="header">
            <div style="display:flex;align-items:center;gap:0.85rem;">
                <div class="tb-logo"><i class="bi bi-person-lines-fill"></i></div>
                <div>
                    <h1>Recherche élève &amp; famille</h1>
                    <p style="color:rgba(255,255,255,0.9);font-size:0.8rem;margin:0;"><span id="cEcole">Établissement</span> — Fiche élève, famille, notes, assiduité et paiements</p>
                </div>
            </div>
            <div style="display:flex;align-items:center;gap:0.75rem;">
                <div class="date-selector"><i class="bi bi-calendar3"></i><input type="date" id="headerDate" onchange="if(window.onHeaderDate)onHeaderDate(this.value)"></div>
                <a href="portail.html" class="btn btn-light" style="text-decoration:none;"><i class="bi bi-arrow-left"></i> Portail</a>
            </div>
        </div>

        <div style="padding:1.5rem 0;">
            <div class="card">
                <h3 style="font-size:1.15rem;font-weight:700;margin-bottom:0.75rem;">Rechercher un élève ou un parent</h3>
                <p style="color:var(--muted,#64748b);font-size:0.9rem;margin-bottom:1rem;">Saisissez le <strong>nom ou le matricule</strong> d'un élève, ou le <strong>nom ou le téléphone</strong> d'un parent.</p>
                <div style="display:flex;gap:0.5rem;flex-wrap:wrap;">
                    <input type="text" id="cSearch" placeholder="Élève, matricule, parent ou téléphone" style="flex:1;min-width:220px;margin:0;">
                    <button class="btn btn-primary" onclick="rechercher()"><i class="bi bi-search"></i> Rechercher</button>
                </div>
            </div>
            <div id="cResult"></div>
        </div>
    </div>

    <script src="js/comptes.js"></script>
    <script src="js/config.js"></script>
    <script src="js/data.js"></script>
    <script src="js/tarifs.js"></script>
    <script src="js/consultation.js"></script>
    <script src="js/headerdate.js"></script>
</body>
</html>
