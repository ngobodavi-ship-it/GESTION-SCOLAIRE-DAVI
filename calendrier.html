<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendrier scolaire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <script src="js/auth.js"></script>
    <style>
        .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
        .cal-head{ text-align:center; font-weight:700; color:#64748b; font-size:0.8rem; padding:0.35rem 0; text-transform:uppercase; }
        .cal-cell{ min-height:92px; border:1px solid #e5e7eb; border-radius:10px; padding:5px; cursor:pointer; background:#fff; transition:all 0.15s; overflow:hidden; }
        .cal-cell:hover{ border-color:#1B6BFF; box-shadow:0 2px 8px rgba(27,107,255,0.15); }
        .cal-empty{ background:#f8fafc; border-style:dashed; cursor:default; }
        .cal-empty:hover{ border-color:#e5e7eb; box-shadow:none; }
        .cal-today{ border-color:#1B6BFF; background:#f5f3ff; }
        .cal-day{ font-weight:700; font-size:0.85rem; margin-bottom:3px; color:#334155; }
        .cal-today .cal-day{ background:#1B6BFF; color:#fff; width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
        .cal-chip{ font-size:0.7rem; color:#fff; border-radius:5px; padding:1px 5px; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .cal-more{ font-size:0.7rem; color:#64748b; font-weight:600; }
        @media (max-width:640px){ .cal-cell{ min-height:64px; } .cal-chip{ font-size:0.6rem; } }
    </style>
</head>
<body>
    <div class="container" style="max-width:1200px;">
        <div class="header">
            <div style="display:flex;align-items:center;gap:0.85rem;">
                <div style="width:38px;height:38px;border-radius:0.6rem;background:rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;font-size:1.2rem;color:#fff;"><i class="bi bi-calendar-event"></i></div>
                <div>
                    <h1 style="font-size:1.4rem;font-weight:700;color:#fff;margin:0;">Calendrier scolaire</h1>
                    <p style="color:rgba(255,255,255,0.9);font-size:0.8rem;margin:0;">Rentrée, congés, examens, conseils et réunions</p>
                </div>
            </div>
            <div class="ms-auto" style="display:flex;align-items:center;gap:0.75rem;"><div class="date-selector"><span>📅</span><input type="date" id="headerDate" onchange="if(window.onHeaderDate)onHeaderDate(this.value)"></div><button class="btn btn-light btn-sm" onclick="logout()"><i class="bi bi-arrow-left"></i> Portail</button></div>
        </div>

        <div class="content-area" style="margin-top:1.25rem;">
            <div class="card">
                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;margin-bottom:1rem;">
                    <div style="display:flex;align-items:center;gap:0.5rem;">
                        <button class="btn btn-secondary" onclick="moisPrecedent()"><i class="bi bi-chevron-left"></i></button>
                        <h3 style="font-size:1.25rem;font-weight:700;margin:0;min-width:200px;text-align:center;" id="calMois">—</h3>
                        <button class="btn btn-secondary" onclick="moisSuivant()"><i class="bi bi-chevron-right"></i></button>
                        <button class="btn btn-secondary" onclick="moisCourant()">Aujourd'hui</button>
                    </div>
                    <button class="btn btn-primary" onclick="nouvelEvt()"><i class="bi bi-plus-lg"></i> Nouvel événement</button>
                </div>
                <div id="calLegende" style="margin-bottom:1rem;"></div>
                <div class="cal-grid" id="calGrid"></div>
                <p style="color:#94a3b8;font-size:0.8rem;margin:0.75rem 0 0;">💡 Cliquez sur un jour pour y ajouter un événement.</p>
            </div>

            <div class="card">
                <h4 style="font-weight:700;margin-bottom:0.5rem;">Événements du mois</h4>
                <div id="calListe"></div>
            </div>
        </div>
    </div>

    <!-- Modal événement -->
    <div id="evtModal" class="app-modal-overlay hidden">
        <div class="app-modal">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;">
                <h3 style="font-size:1.3rem;font-weight:700;margin:0;" id="evtModalTitle">Nouvel événement</h3>
                <button onclick="hideEvtModal()" style="background:none;border:none;cursor:pointer;font-size:1.4rem;">✖</button>
            </div>
            <form onsubmit="saveEvt(event)">
                <div class="row g-2">
                    <div class="col-md-7"><label class="form-label" style="font-weight:600;">Titre *</label><input type="text" id="evtTitre" required></div>
                    <div class="col-md-5"><label class="form-label" style="font-weight:600;">Date *</label><input type="date" id="evtDate" required></div>
                    <div class="col-md-12"><label class="form-label" style="font-weight:600;">Type</label><select id="evtType"></select></div>
                    <div class="col-md-12"><label class="form-label" style="font-weight:600;">Description</label><textarea id="evtDesc" rows="3"></textarea></div>
                </div>
                <div style="display:flex;gap:1rem;margin-top:1.5rem;">
                    <button type="button" class="btn btn-secondary" onclick="hideEvtModal()" style="flex:1;">Annuler</button>
                    <button type="submit" class="btn btn-primary" style="flex:1;">✓ Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/calendrier.js"></script>
    <script src="js/headerdate.js"></script>
</body>
</html>
